<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Faculty Attendance System</title>
  <style>
    :root{--navy:#172554;--blue:#2563eb;--ink:#172033;--muted:#64748b;--line:#e2e8f0;--bg:#f8fafc;--green:#15803d;--red:#b91c1c}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Inter,Segoe UI,Arial,sans-serif}
    button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:8px;padding:10px 15px;font-weight:600}
    .primary{background:var(--blue);color:#fff}.secondary{background:#eef2ff;color:var(--navy)}.danger{color:var(--red);background:#fef2f2}
    .login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#172554,#2563eb)}
    .login-card{width:min(420px,92vw);background:#fff;border-radius:18px;padding:36px;box-shadow:0 24px 60px #0f172a55}
    .brand{display:flex;align-items:center;gap:12px;color:var(--navy)}.brand-mark{background:var(--blue);color:#fff;padding:10px;border-radius:10px;font-weight:800}
    h1{font-size:25px;margin:26px 0 8px}h2{font-size:20px;margin:0 0 5px}h3{margin:0 0 12px}.muted{color:var(--muted)}label{display:block;color:#334155;font-weight:600;margin:18px 0 7px}
    input,select{width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:11px;background:#fff}.login .primary{width:100%;margin-top:22px}
    .app{display:none;min-height:100vh}.topbar{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px}
    .layout{display:flex}.sidebar{width:235px;background:var(--navy);color:#cbd5e1;min-height:calc(100vh - 68px);padding:22px 14px}.sidebar button{display:block;width:100%;text-align:left;background:transparent;color:inherit;margin:4px 0}.sidebar button:hover,.sidebar button.active{background:#ffffff18;color:#fff}
    main{padding:30px;max-width:1250px;width:100%}.page-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px}.metric{font-size:28px;font-weight:750;margin:8px 0}.section{margin-top:24px}.toolbar{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:15px 0}.table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:14px 16px;border-bottom:1px solid var(--line)}th{background:#f8fafc;color:#475569;font-size:12px;text-transform:uppercase}tr:last-child td{border-bottom:0}
    .pill{border-radius:99px;padding:5px 10px;font-size:12px;font-weight:700}.present{background:#dcfce7;color:var(--green)}.absent{background:#fee2e2;color:var(--red)}.low{color:var(--red);font-weight:700}
    .view{display:none}.view.active{display:block}.toast{position:fixed;right:24px;bottom:24px;background:#172554;color:#fff;padding:13px 18px;border-radius:9px;display:none}
    @media(max-width:800px){.sidebar{width:65px}.sidebar button{font-size:0}.sidebar button:first-letter{font-size:18px}main{padding:20px}.grid{grid-template-columns:repeat(2,1fr)}.toolbar{grid-template-columns:1fr 1fr}.topbar{padding:0 15px}}
  </style>
</head>
<body>
  <section class="login" id="login">
    <div class="login-card">
      <div class="brand"><span class="brand-mark">FAS</span><strong>Faculty Attendance System</strong></div>
      <h1>Welcome back</h1><p class="muted">Sign in to manage and monitor attendance.</p>
      <label for="role">Prototype role</label>
      <select id="role"><option value="admin">Administrator</option><option value="faculty">Faculty Member</option><option value="student">Student</option><option value="hod">Head of Department</option></select>
      <label for="email">Username or email</label><input id="email" value="demo@fas.edu">
      <label for="password">Password</label><input id="password" type="password" value="password">
      <button class="primary" onclick="signIn()">Sign in</button>
      <p class="muted" style="font-size:12px;margin-top:18px">Demo prototype: any non-empty credentials are accepted.</p>
    </div>
  </section>

  <section class="app" id="app">
    <header class="topbar"><div class="brand"><span class="brand-mark">FAS</span><strong>Faculty Attendance System</strong></div><div><span class="muted" id="userLabel"></span> <button class="secondary" onclick="signOut()">Sign out</button></div></header>
    <div class="layout"><aside class="sidebar" id="nav"></aside><main>
      <section id="dashboard" class="view active"></section>
      <section id="attendance" class="view"></section>
      <section id="reports" class="view"></section>
      <section id="masters" class="view"></section>
    </main></div>
  </section>
  <div class="toast" id="toast"></div>
  <script>
    const API_BASE = localStorage.getItem('fasApiBase') || 'http://127.0.0.1:5000/api';
    let accessToken = localStorage.getItem('fasAccessToken');
    const data={students:[
      ['20CS001','Aarav Kumar','Present'],['20CS002','Ananya Rao','Present'],['20CS003','David John','Absent'],
      ['20CS004','Fatima Ali','Present'],['20CS005','Kiran Patel','Present'],['20CS006','Meera Shah','Absent']
    ]};
    let currentRole='admin';
    const names={admin:'Administrator',faculty:'Dr. Priya Sharma',student:'Aarav Kumar',hod:'Dr. R. Menon'};
    async function api(path, options={}){const response=await fetch(API_BASE+path,{...options,headers:{'Content-Type':'application/json',...(accessToken?{Authorization:`Bearer ${accessToken}`}:{})}});const body=await response.json().catch(()=>({}));if(!response.ok)throw new Error(body.error||'Request failed');return body}
    async function signIn(){if(!email.value.trim()||!password.value){show('Enter valid login details');return}try{const result=await api('/auth/login',{method:'POST',body:JSON.stringify({username:email.value.trim(),password:password.value})});if(result.user.role!==role.value){show('Selected role does not match this account');return}accessToken=result.access_token;localStorage.setItem('fasAccessToken',accessToken);currentRole=result.user.role;login.style.display='none';app.style.display='block';userLabel.textContent=result.user.username;buildNav();showView('dashboard')}catch(error){show(error.message)}}
    function signOut(){accessToken=null;localStorage.removeItem('fasAccessToken');app.style.display='none';login.style.display='grid'}
    function buildNav(){const items=[['dashboard','▣ Dashboard']];if(currentRole==='faculty'||currentRole==='hod')items.push(['attendance','✓ Mark / edit attendance']);items.push(['reports','▤ Attendance reports']);if(currentRole==='admin'||currentRole==='hod')items.push(['masters','⚙ Master data']);nav.innerHTML=items.map(x=>`<button onclick="showView('${x[0]}')">${x[1]}</button>`).join('')}
    function showView(id){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');if(id==='dashboard')renderDashboard();if(id==='attendance')renderAttendance();if(id==='reports')renderReports();if(id==='masters')renderMasters()}
    function renderDashboard(){let cards=currentRole==='student'?[['Overall attendance','88%','12 attended of 14'],['Subjects','6','Current semester'],['Attendance status','Eligible','Threshold: 75%'],['Last updated','Today','10:32 AM']]:[['Students','1,248','Active records'],['Faculty','68','Assigned faculty'],['Subjects','42','Current semester'],['Today’s attendance','92%','Across all sections']];const studentActions=currentRole==='student'?'<button class="primary" onclick="showView(\'reports\')">View my attendance</button>':'';const facultyActions=(currentRole==='faculty'||currentRole==='hod')?'<button class="primary" onclick="showView(\'attendance\')">Mark / edit attendance</button>':'';const reportActions=(currentRole==='admin'||currentRole==='hod'||currentRole==='faculty')?'<button class="secondary" onclick="showView(\'reports\')">View attendance reports</button>':'';const masterActions=(currentRole==='admin'||currentRole==='hod')?'<button class="secondary" onclick="showView(\'masters\')">Manage all master data</button>':'';dashboard.innerHTML=`<div class="page-head"><div><h2>${names[currentRole]} dashboard</h2><p class="muted">${currentRole==='hod'?'Full institutional access within the FAS application.':'Here is your attendance overview.'}</p></div></div><div class="grid">${cards.map(c=>`<div class="card"><span class="muted">${c[0]}</span><div class="metric">${c[1]}</div><span class="muted">${c[2]}</span></div>`).join('')}</div><div class="section card"><h3>Quick actions</h3>${studentActions}${facultyActions}${reportActions}${masterActions||'<button class="primary" onclick="showView(\'reports\')">View attendance reports</button>'}</div>`}
    async function renderAttendance(){attendance.innerHTML='<div class="card">Loading assigned students...</div>';try{const result=await api('/students');attendance.innerHTML=`<div class="page-head"><div><h2>Mark attendance</h2><p class="muted">Record attendance for an assigned class and subject.</p></div><button class="secondary" onclick="showView('reports')">View history</button></div><div class="card"><div class="toolbar"><input id="sectionId" placeholder="Section ID" value="1"><input id="subjectId" placeholder="Subject ID" value="1"><input id="sessionDate" type="date" value="${new Date().toISOString().slice(0,10)}"><span></span></div><div class="table-wrap"><table><thead><tr><th>Roll number</th><th>Student name</th><th>Status</th></tr></thead><tbody>${result.items.map((s,i)=>`<tr><td>${s.roll_number}</td><td>${s.name}</td><td><select id="s${i}" data-student="${s.student_id}"><option>Present</option><option>Absent</option></select></td></tr>`).join('')}</tbody></table></div><button class="primary" style="margin-top:18px" onclick="saveAttendance()">Submit attendance</button></div>`}catch(error){attendance.innerHTML=`<div class="card">${error.message}</div>`}}
    async function saveAttendance(){try{const records=[...document.querySelectorAll('[data-student]')].map(select=>({student_id:Number(select.dataset.student),status:select.value}));await api('/attendance/sessions',{method:'POST',body:JSON.stringify({subject_id:Number(subjectId.value),section_id:Number(sectionId.value),session_date:sessionDate.value,records})});show('Attendance saved successfully')}catch(error){show(error.message)}}
    async function renderReports(){reports.innerHTML='<div class="card">Loading attendance report...</div>';try{const result=await api('/reports/attendance');reports.innerHTML=`<div class="page-head"><div><h2>Attendance reports</h2><p class="muted">View attendance summaries from the database.</p></div></div><div class="card"><div class="table-wrap"><table><thead><tr><th>Roll number</th><th>Student</th><th>Classes attended</th><th>Classes conducted</th><th>Percentage</th></tr></thead><tbody>${result.items.map(s=>`<tr><td>${s.roll_number}</td><td>${s.name}</td><td>${s.classes_attended}</td><td>${s.classes_conducted}</td><td class="${s.attendance_percentage<75?'low':''}">${s.attendance_percentage}%</td></tr>`).join('')}</tbody></table></div></div>`}catch(error){reports.innerHTML=`<div class="card">${error.message}</div>`}}
    function renderMasters(){masters.innerHTML=`<div class="page-head"><div><h2>Master data</h2><p class="muted">${currentRole==='hod'?'Full access: add, view, update, deactivate and assign records.':'Maintain the records used by attendance workflows.'}</p></div><button class="primary" onclick="show('New record form opened')">Add record</button></div><div class="grid">${[['Students','1,248','Add, view, update or deactivate students'],['Faculty','68','Add, view, update or deactivate faculty'],['Subjects','42','Create and maintain subjects'],['Classes & sections','24','Create and maintain academic structure'],['User accounts','1,316','Create, activate or deactivate accounts'],['Faculty assignments','96','Assign faculty to subjects and sections']].map(c=>`<div class="card"><h3>${c[0]}</h3><div class="metric">${c[1]}</div><span class="muted">${c[2]}</span></div>`).join('')}</div>`}
    function show(message){toast.textContent=message;toast.style.display='block';setTimeout(()=>toast.style.display='none',2400)}
    renderDashboard();
  </script>
</body>
</html>
