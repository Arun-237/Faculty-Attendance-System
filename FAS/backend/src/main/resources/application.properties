spring.application.name=FAS
spring.profiles.default=local

spring.datasource.url=jdbc:mysql://localhost:3306/fas?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
app.cors.allowed-origins=http://localhost:5173
fas.seed.administrator.username=Admin
fas.seed.hod.username=HOD